<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#24558d">
<title>Bill Wallah — ₹15 Cashback</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap');

:root{
  --blue:#24558d;
  --blue-dark:#173e6b;
  --blue-soft:#edf5ff;
  --blue-line:#cdddf0;
  --ink:#111827;
  --muted:#61708a;
  --border:#d9e0e8;
  --soft:#f7f9fc;
  --white:#fff;
  --green:#17824b;
  --red:#c53b3b;
  --amber:#9b6b19;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:#fff;color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased
}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{width:min(620px,calc(100% - 32px));margin:0 auto;padding:30px 0 64px}
.brand-row{display:flex;align-items:center;gap:10px;margin-bottom:42px}
.brand-mark{width:32px;height:32px;border-radius:8px;overflow:hidden;border:1px solid var(--border);flex:none}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.brand-row span{font-family:Sora,sans-serif;font-weight:700;font-size:16px}
.intro h1{font-family:Sora,sans-serif;font-size:30px;line-height:1.18;letter-spacing:-.035em;margin:0 0 10px}
.intro p{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 28px;max-width:560px}
.reward-chip{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 11px;border-radius:999px;
  background:var(--blue-soft);color:var(--blue-dark);
  border:1px solid var(--blue-line);font-weight:700;font-size:12px;margin-bottom:14px
}
.reward-chip span{font-size:15px}
.progress{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.progress-track{height:4px;flex:1;background:#e4e9f0;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:var(--blue);border-radius:99px;transition:width .25s ease}
.progress-text{font-size:12px;color:#8995a7;white-space:nowrap}
.steps{position:relative}
.step{display:flex;gap:13px}
.step-rail{width:25px;display:flex;flex-direction:column;align-items:center;flex:none}
.step-dot{
  width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#fff;border:1.5px solid #cdd5e0;color:#6d7888;
  font-size:11px;font-weight:700;z-index:1
}
.step.done .step-dot{background:var(--blue);border-color:var(--blue);color:#fff}
.step-line{width:1px;flex:1;background:#d9e1eb;margin:2px 0}
.step:last-child .step-line{display:none}
.step-body{flex:1;min-width:0;padding-bottom:28px}
.step-title{font-family:Sora,sans-serif;font-size:15.5px;font-weight:700;line-height:1.35;margin:1px 0 4px}
.step-desc{font-size:13.5px;color:var(--muted);line-height:1.55;margin-bottom:9px}
.step-link{
  display:inline-block;color:var(--blue-dark);font-size:13.5px;font-weight:600;
  text-decoration:none;border-bottom:1px solid #b7c7da;padding-bottom:1px
}
.step-link:hover{border-color:var(--blue)}
.upload-row{
  margin-top:12px;min-height:58px;display:flex;align-items:center;gap:10px;
  border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:#fff;
  transition:.15s ease
}
.upload-row:hover{border-color:#a9bdd5;background:#fbfdff}
.upload-row.filled{border-color:#9eb7d3;background:#fbfdff}
.upload-thumb,.upload-placeholder{width:38px;height:38px;border-radius:7px;object-fit:cover;flex:none}
.upload-placeholder{background:#f0f4f8;border:1px solid #e5eaf0}
.upload-status{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.upload-status b{color:var(--ink);font-weight:600}
.upload-btn{
  color:var(--blue-dark);font-size:12.5px;font-weight:700;
  background:none;border:0;padding:3px;text-decoration:underline;text-underline-offset:3px
}
input[type=file]{display:none}
.contact-section{border-top:1px solid var(--border);padding-top:24px;margin-top:2px}
.field-label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}
.field-input{
  width:100%;height:46px;padding:0 12px;border:1px solid #cdd5df;border-radius:9px;
  background:#fff;color:var(--ink);outline:none;transition:.15s
}
.field-input:focus{border-color:#7fa0c3;box-shadow:0 0 0 3px rgba(36,85,141,.08)}
.field-input:disabled{background:#f5f7fa;color:#98a2b3}
.field-hint{font-size:12px;color:#8995a7;margin-top:7px}
.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:18px}
.checkbox{
  display:flex;align-items:flex-start;gap:9px;margin-top:17px;
  color:#536176;font-size:12.5px
}
.checkbox input{width:17px;height:17px;margin:1px 0 0;accent-color:var(--blue)}
.receipt{
  margin-top:20px;padding:14px 16px;border:1px solid var(--blue-line);
  border-radius:10px;background:var(--blue-soft);display:flex;align-items:center;justify-content:space-between
}
.receipt-label{font-size:13px;color:var(--muted)}
.receipt-value{font-family:Sora,sans-serif;font-size:18px;font-weight:700;color:var(--blue-dark)}
.submit-btn{
  width:100%;min-height:48px;border:0;border-radius:9px;margin-top:16px;
  background:var(--blue);color:#fff;font-weight:700;font-size:14px;transition:.15s
}
.submit-btn:hover:not(:disabled){background:var(--blue-dark);transform:translateY(-1px)}
.submit-btn:disabled{background:#dfe5ec;color:#98a2b3;cursor:not-allowed}
.fine-print{font-size:11.5px;color:#8a95a5;line-height:1.55;margin-top:12px}
.alert{padding:11px 13px;border-radius:9px;font-size:13px;margin-top:12px}
.alert.error{background:#fff5f5;color:var(--red);border:1px solid #efcccc}
.alert.success{background:#f0faf5;color:var(--green);border:1px solid #ccebd9}
.hidden{display:none!important}
.success-wrap{padding-top:0}
.check-mark{
  width:40px;height:40px;border-radius:50%;background:#edf9f2;border:1px solid #bfe5cf;
  display:flex;align-items:center;justify-content:center;margin-bottom:18px
}
.success-wrap h2{font-family:Sora,sans-serif;font-size:24px;margin:0 0 8px}
.success-wrap>p{font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 20px}
.receipt-detail{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.receipt-detail-row{display:flex;justify-content:space-between;gap:20px;padding:13px 15px;border-bottom:1px solid var(--border);font-size:13px}
.receipt-detail-row:last-child{border-bottom:0}
.receipt-detail-row span:first-child{color:var(--muted)}
.receipt-detail-row span:last-child{font-weight:600;text-align:right}
.reference-box{margin-top:18px;padding:15px;background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:10px}
.reference-box small{color:var(--muted);display:block}
.reference-box strong{display:block;color:var(--blue-dark);font-family:Sora,sans-serif;font-size:20px;margin-top:2px}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.secondary-btn{
  min-height:44px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:var(--blue-dark);
  font-weight:700;font-size:13px
}
.secondary-btn:hover{background:var(--soft);border-color:#a8b9cc}
.status-section{border-top:1px solid var(--border);margin-top:22px;padding-top:28px}
.status-section h2{font-family:Sora,sans-serif;font-size:20px;margin:0 0 6px}
.status-section>p{color:var(--muted);font-size:13px;margin:0 0 15px}
.status-form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.status-form input{margin:0}
.status-form button{padding:0 15px;border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:700}
.status-result{margin-top:14px}
.status-card{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.status-row{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px}
.status-row:last-child{border-bottom:0}
.status-row span:first-child{color:var(--muted)}
.status-pill{display:inline-flex;padding:4px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue-dark);font-size:11.5px;font-weight:700}
.app-card{
  margin-top:28px;padding:20px;border:1px solid var(--border);border-radius:11px;background:#fafbfd
}
.app-card h2{font-family:Sora,sans-serif;font-size:19px;margin:0 0 4px}
.app-card p{color:var(--muted);font-size:12.5px;margin:0}
.footer{border-top:1px solid var(--border);padding-top:22px;margin-top:30px;color:#8a95a5;font-size:11.5px}
.footer-links{display:flex;flex-wrap:wrap;gap:13px;margin-top:10px}
.footer-links a{text-decoration:none}.footer-links a:hover{color:var(--blue)}
.admin-link-row{margin-top:22px}.admin-link-row button{border:0;background:none;color:#98a2b3;font-size:11.5px;padding:0;text-decoration:underline}
.modal-overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal-box{width:min(340px,100%);background:#fff;border:1px solid var(--border);border-radius:12px;padding:21px}
.modal-box h3{font-family:Sora,sans-serif;font-size:17px;margin:0 0 14px}
.modal-box input{width:100%;height:44px;border:1px solid var(--border);border-radius:8px;padding:0 11px}
.modal-actions{display:flex;gap:8px;margin-top:12px}.modal-actions button{flex:1;height:42px;border-radius:8px;border:1px solid var(--border);background:#fff}
.modal-confirm{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important}
.modal-error{color:var(--red);font-size:12px;margin-bottom:9px}
@media(max-width:640px){
  .wrap{padding-top:24px}
  .brand-row{margin-bottom:34px}
  .intro h1{font-size:28px}
  .details-grid{grid-template-columns:1fr}
  .status-form{grid-template-columns:1fr}
  .status-form button{min-height:44px}
  .action-row{grid-template-columns:1fr}
}
</style>
</head>

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function checkSvg(){
  return `<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2L4.8 8.5L9.5 3.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function greenCheck(){
  return `<svg width="17" height="17" viewBox="0 0 18 18" fill="none"><path d="M3.5 9.2L7.1 12.7L14.5 5.2" stroke="#17824b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function resizeImage(file, maxWidth=900, quality=.72){
  return new Promise((resolve,reject)=>{
    if(!file.type.startsWith("image/")) return reject(new Error("Please select an image."));
    if(file.size > 8*1024*1024) return reject(new Error("Image must be smaller than 8 MB."));
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w=img.width,h=img.height;
        if(w>maxWidth){h=Math.round(h*(maxWidth/w));w=maxWidth}
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>{
          if(!blob) return reject(new Error("Could not process image."));
          resolve(new File([blob],"proof.jpg",{type:"image/jpeg"}));
        },"image/jpeg",quality);
      };
      img.onerror=()=>reject(new Error("Could not read image."));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error("Could not read image."));
    reader.readAsDataURL(file);
  });
}

                </label>
              </div>
            </div>
          </div>
        `).join("")}
      </section>

      <section class="contact-section">
        <label class="field-label" for="instagram-username">Instagram username</label>
        <input id="instagram-username" class="field-input" type="text" maxlength="50"
          placeholder="Your Instagram username" value="${esc(state.instagramUsername)}">
        <div class="field-hint">Enter the username for the account you followed.</div>

        <label class="field-label" for="mobile">Mobile number</label>
        <input id="mobile" class="field-input" type="tel" inputmode="numeric" maxlength="10"
          placeholder="10-digit mobile number" value="${esc(state.mobile)}" ${countDone()===3 ? "" : "disabled"}>
        <div class="field-hint">${countDone()===3 ? "We'll use this number for the ₹15 payout." : "Complete all three steps to continue."}</div>

        <label class="checkbox">
          <input id="confirm" type="checkbox" ${countDone()===3 ? "" : "disabled"}>
          <span>I confirm that I completed all 3 steps and that the screenshots I submitted are genuine.</span>
        </label>

        <div class="receipt">
          <span class="receipt-label">You'll receive if approved</span>
          <span class="receipt-value">₹15</span>
        </div>

        <div id="form-alert" class="alert error hidden"></div>
        <button class="submit-btn" id="submit-btn" ${countDone()===3 ? "" : "disabled"}>
          ${state.submitting ? "Submitting…" : "Submit for verification"}
        </button>

        <div class="fine-print">One submission per mobile number. Our team manually verifies screenshots. Approval does not mean payment has already been sent.</div>
      </section>

      <section class="status-section">
        <h2>Check your submission</h2>
        <p>Use your Submission ID and mobile number to see the latest status.</p>
        <div class="status-form">
          <input id="status-id" class="field-input" placeholder="Submission ID">
          <input id="status-mobile" class="field-input" inputmode="numeric" maxlength="10" placeholder="Mobile number">
          <button id="status-btn">Check</button>
        </div>
        <div id="status-result" class="status-result"></div>
      </section>

      <div class="app-card">
        <h2>Recharge smarter with Bill Wallah</h2>
        <p>The Bill Wallah Recharge App — coming soon here. No fake download link.</p>
      </div>

      <div class="admin-link-row">
        <button id="admin-link">Admin login</button>
      </div>

      <footer class="footer">
        <strong>Bill Wallah</strong>
        <div class="footer-links">
          <a href="${LINKS.instagram}" target="_blank" rel="noopener">Instagram</a>
          <a href="${LINKS.youtube}" target="_blank" rel="noopener">YouTube</a>
          <a href="${LINKS.founder}" target="_blank" rel="noopener">Founder Instagram</a>
          <a href="#">Terms & Conditions</a>
          <a href="#">Privacy Policy</a>
        </div>
      </footer>
    </main>
  `;

  bind();
}

function bind(){
  document.querySelectorAll('input[type=file]').forEach(input=>{
    input.addEventListener("change",async e=>{
      const file=e.target.files?.[0];
      if(!file)return;
      try{
        state.shots[e.target.dataset.step]=await resizeImage(file);
        render();
      }catch(err){
        showAlert(err.message);
      }
    });
  });

  const mobile=$("#mobile");
  const instagramUsername=$("#instagram-username");
  if(instagramUsername) instagramUsername.addEventListener("input",e=>{
    state.instagramUsername=e.target.value.trim().slice(0,50);
    e.target.value=state.instagramUsername;
  });

  if(mobile) mobile.addEventListener("input",e=>{
    state.mobile=e.target.value.replace(/\D/g,"").slice(0,10);
    e.target.value=state.mobile;
  });

  $("#submit-btn")?.addEventListener("click",handleSubmit);
  $("#status-btn")?.addEventListener("click",checkStatus);
  $("#admin-link")?.addEventListener("click",()=>location.href="/admin");
}

function showAlert(message){
  const box=$("#form-alert");
  if(!box)return;
  box.textContent=message;
  box.classList.remove("hidden");
  box.scrollIntoView({behavior:"smooth",block:"nearest"});
}

async function handleSubmit(){
  if(state.submitting)return;

  if(countDone()!==3)return showAlert("Please upload all three screenshots.");
  if(!state.instagramUsername)return showAlert("Enter your Instagram username.");
  if(!/^[6-9]\d{9}$/.test(state.mobile))return showAlert("Enter a valid 10-digit Indian mobile number.");
  if(!$("#confirm")?.checked)return showAlert("Please confirm that you completed all 3 steps.");

  state.submitting=true;
  render();

  try{
    const fd=new FormData();
    fd.append("mobileNumber",state.mobile);
    fd.append("instagramUsername",state.instagramUsername);
    fd.append("confirm","on");
    fd.append("instagramScreenshot",state.shots.insta,"instagram-proof.jpg");
    fd.append("youtubeScreenshot",state.shots.youtube,"youtube-proof.jpg");
    fd.append("founderInstagramScreenshot",state.shots.founder,"founder-proof.jpg");

    const response=await fetch("/api/submissions",{method:"POST",body:fd});
    const data=await response.json().catch(()=>({}));

    if(!response.ok)throw new Error(data.error || "Could not submit right now.");

    state.refId=data.submissionId;
    renderSuccess();
  }catch(err){
    state.submitting=false;
    render();
    showAlert(err.message);
  }
}

function renderSuccess(){
  const app=$("#app");
  app.innerHTML=`
    <main class="wrap success-wrap">
      <div class="brand-row">
        <div class="brand-mark"><img src="${LOGO_SRC}" alt="Bill Wallah"></div>
        <span>Bill Wallah</span>
      </div>

      <div class="check-mark">${greenCheck()}</div>
      <h2>Submission received</h2>
      <p>Your screenshots have been submitted for manual verification. We'll review your entry within 48 hours. If approved, the team will manually send ₹15 to your submitted mobile number.</p>

      <div class="reference-box">
        <small>Submission ID</small>
        <strong>${esc(state.refId)}</strong>
        <small>Keep this ID for checking your status later.</small>
      </div>

      <div class="receipt-detail" style="margin-top:14px">
        <div class="receipt-detail-row"><span>Mobile number</span><span>${esc(state.mobile)}</span></div>
        <div class="receipt-detail-row"><span>Status</span><span>Pending review</span></div>
        <div class="receipt-detail-row"><span>Reward</span><span>₹15 if approved</span></div>
      </div>

      <div class="action-row">
        <button class="secondary-btn" id="check-now">Check status</button>
        <button class="secondary-btn" id="new-entry">Done</button>
      </div>
    </main>
  `;

  $("#check-now").onclick=()=>{
    render();
    $("#status-id").value=state.refId||"";
    $("#status-mobile").value=state.mobile;
    $("#status-btn").click();
    document.querySelector(".status-section")?.scrollIntoView({behavior:"smooth"});
  };

  $("#new-entry").onclick=()=>{
    state.shots={insta:null,youtube:null,founder:null};
    state.mobile="";
    state.submitting=false;
    state.refId=null;
    render();
  };
}

async function checkStatus(){
  const id=$("#status-id")?.value.trim();
  const mobile=$("#status-mobile")?.value.trim();

  if(!id || !/^[6-9]\d{9}$/.test(mobile)){
    return $("#status-result").innerHTML=`<div class="alert error">Enter a valid Submission ID and 10-digit Indian mobile number.</div>`;
  }

  const btn=$("#status-btn");
  btn.disabled=true;
  btn.textContent="Checking…";

  try{
    const response=await fetch(`/api/status?submissionId=${encodeURIComponent(id)}&mobileNumber=${encodeURIComponent(mobile)}`);
    const data=await response.json().catch(()=>({}));

    if(!response.ok)throw new Error(data.error || "Could not check status.");

    const displayStatus=data.status==="Pending" ? "Under Review" : data.status==="Approved" ? "Approved — payout pending" : data.status==="Rejected" ? "Rejected" : data.status;
    $("#status-result").innerHTML=`
      <div class="status-card">
        <div class="status-row"><span>Submission ID</span><strong>${esc(data.submissionId)}</strong></div>
        <div class="status-row"><span>Status</span><span class="status-pill">${esc(displayStatus)}</span></div>
        <div class="status-row"><span>Submitted</span><strong>${new Date(data.submittedAt).toLocaleString()}</strong></div>
        <div class="status-row"><span>Payout</span><strong>${data.paymentStatus==="Paid" ? "Paid ₹15" : "Pending"}</strong></div>
        ${data.rejectionReason ? `<div class="status-row"><span>Reason</span><strong>${esc(data.rejectionReason)}</strong></div>` : ""}
      </div>
    `;
  }catch(err){
    $("#status-result").innerHTML=`<div class="alert error">${esc(err.message)}</div>`;
  }finally{
    btn.disabled=false;
    btn.textContent="Check";
  }
}

render();
</script>
</body>
</html>
