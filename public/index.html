<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Complete simple steps and get ₹15 from Bill Wallah.">

  <title>Bill Wallah — Get ₹15</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --blue: #155EEF;
      --blue-dark: #0B46C1;
      --blue-light: #EFF4FF;

      --green: #039855;
      --green-light: #ECFDF3;

      --yellow: #F79009;
      --yellow-light: #FFFAEB;

      --text: #101828;
      --text-2: #344054;
      --muted: #667085;
      --subtle: #98A2B3;

      --border: #EAECF0;
      --border-dark: #D0D5DD;

      --background: #F8FAFC;
      --white: #FFFFFF;

      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 9px;

      --shadow:
        0 1px 2px rgba(16, 24, 40, .04),
        0 4px 14px rgba(16, 24, 40, .04);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* =========================================
       APP CONTAINER
    ========================================= */

    .page {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 50px;
    }

    /* =========================================
       HEADER
    ========================================= */

    .header {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--blue);
      color: white;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    .reward-tag {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border: 1px solid #D6E2FF;
      border-radius: 8px;
      background: white;
      color: var(--blue-dark);
      font-size: 11px;
      font-weight: 700;
    }

    .reward-tag span {
      font-size: 15px;
    }

    /* =========================================
       HERO
    ========================================= */

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 300px;
      display: grid;
      grid-template-columns: 1fr 300px;
      align-items: center;
      gap: 25px;

      padding: 42px 46px;
      margin-bottom: 16px;

      background: #F0F5FF;
      border: 1px solid #DCE7FF;
      border-radius: var(--radius-lg);
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      color: var(--blue);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 20px;
      height: 2px;
      background: var(--blue);
    }

    .hero h1 {
      margin: 12px 0 10px;
      max-width: 510px;

      font-size: clamp(34px, 5vw, 52px);
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 800;
    }

    .hero h1 strong {
      color: var(--blue);
    }

    .hero-description {
      max-width: 470px;
      margin: 0;

      color: var(--text-2);
      font-size: 14px;
      line-height: 1.65;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 24px;
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 8px 10px;
      background: white;
      border: 1px solid #E1E8F5;
      border-radius: 8px;

      color: var(--text-2);
      font-size: 10px;
      font-weight: 600;
    }

    .meta-icon {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: var(--blue-light);
      color: var(--blue);
      font-size: 11px;
    }

    /* Reward visual */

    .reward-visual {
      position: relative;
      height: 220px;
      display: grid;
      place-items: center;
    }

    .receipt {
      position: relative;
      width: 225px;
      height: 145px;

      background: white;
      border: 1px solid #D9E2F2;
      box-shadow: 0 18px 40px rgba(21, 94, 239, .13);

      transform: rotate(3deg);
      z-index: 2;
    }

    .receipt::before,
    .receipt::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 8px;

      background:
        radial-gradient(circle at 5px 0, transparent 4px, white 4.5px)
        repeat-x;
      background-size: 10px 10px;
    }

    .receipt::before {
      top: -5px;
    }

    .receipt::after {
      bottom: -5px;
      transform: rotate(180deg);
    }

    .receipt-inner {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .receipt-label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .receipt-amount {
      margin: 5px 0;

      color: var(--blue);
      font-size: 48px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -.06em;
    }

    .receipt-free {
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--yellow-light);
      color: #B54708;
      font-size: 10px;
      font-weight: 800;
    }

    .visual-dot {
      position: absolute;
      border-radius: 50%;
      background: var(--blue);
    }

    .visual-dot.one {
      width: 9px;
      height: 9px;
      top: 25px;
      right: 35px;
    }

    .visual-dot.two {
      width: 6px;
      height: 6px;
      bottom: 25px;
      left: 25px;
    }

    .visual-line {
      position: absolute;
      width: 75px;
      height: 75px;
      right: 15px;
      bottom: 5px;

      border: 1px solid #BFD0FF;
      border-radius: 50%;
    }

    /* =========================================
       MAIN CARD
    ========================================= */

    .main-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 22px 24px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.025em;
    }

    .card-subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .progress-count {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    .progress-bar {
      height: 3px;
      background: #F2F4F7;
    }

    .progress-fill {
      height: 100%;
      background: var(--blue);
      transition: width .25s ease;
    }

    /* =========================================
       STEPS
    ========================================= */

    .steps {
      padding: 5px 24px 0;
    }

    .step {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 15px;

      padding: 23px 0;
      border-bottom: 1px solid var(--border);
    }

    .step:last-child {
      border-bottom: 0;
    }

    .step-number {
      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border: 1px solid var(--border-dark);
      border-radius: 9px;

      background: white;
      color: var(--muted);

      font-size: 12px;
      font-weight: 800;
    }

    .step.done .step-number {
      border-color: var(--blue);
      background: var(--blue);
      color: white;
    }

    .step-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
    }

    .step-title {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.015em;
    }

    .step-description {
      margin: 4px 0 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .step-link {
      display: inline-flex;
      color: var(--blue);
      font-size: 10.5px;
      font-weight: 700;
      text-decoration: none;
    }

    .step-link:hover {
      text-decoration: underline;
    }

    /* =========================================
       UPLOAD
    ========================================= */

    .upload-box {
      display: flex;
      align-items: center;
      gap: 11px;

      margin-top: 13px;
      padding: 9px;

      border: 1px dashed var(--border-dark);
      border-radius: 10px;
      background: #FAFBFC;

      transition: .15s ease;
    }

    .upload-box:hover,
    .upload-box.filled {
      border-color: #91AEFF;
      background: var(--blue-light);
    }

    .upload-preview,
    .upload-placeholder {
      width: 42px;
      height: 42px;
      flex: none;

      border-radius: 8px;
      object-fit: cover;
    }

    .upload-placeholder {
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      background: #F2F4F7;
      color: var(--subtle);
      font-size: 18px;
    }

    .upload-info {
      flex: 1;
      min-width: 0;
    }

    .upload-info strong {
      display: block;
      overflow: hidden;

      color: var(--text);
      font-size: 10.5px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .upload-info span {
      color: var(--muted);
      font-size: 9px;
    }

    .upload-button {
      padding: 8px 11px;

      border: 1px solid #BFD0FF;
      border-radius: 7px;

      background: white;
      color: var(--blue);

      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .upload-button:hover {
      background: var(--blue);
      color: white;
    }

    input[type="file"] {
      display: none;
    }

    /* =========================================
       FORM
    ========================================= */

    .details {
      margin: 0 24px;
      padding: 25px 0 24px;
      border-top: 1px solid var(--border);
    }

    .details-heading {
      margin-bottom: 18px;
    }

    .details-heading h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
    }

    .details-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 10.5px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;

      font-size: 10.5px;
      font-weight: 700;
    }

    .input {
      width: 100%;
      height: 44px;
      padding: 0 12px;

      border: 1px solid var(--border-dark);
      border-radius: 8px;

      background: white;
      color: var(--text);

      outline: none;
      font-size: 12px;

      transition: .15s ease;
    }

    .input::placeholder {
      color: #A6AFBD;
    }

    .input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(21, 94, 239, .08);
    }

    .input:disabled {
      background: #F2F4F7;
      color: var(--subtle);
      cursor: not-allowed;
    }

    .hint {
      margin-top: 5px;
      color: var(--subtle);
      font-size: 9px;
    }

    .confirm {
      display: flex;
      align-items: flex-start;
      gap: 8px;

      margin-top: 16px;

      color: var(--muted);
      font-size: 10px;
      line-height: 1.45;
    }

    .confirm input {
      width: 16px;
      height: 16px;
      flex: none;
      margin: 0;

      accent-color: var(--blue);
    }

    .reward-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-top: 17px;
      padding: 12px 14px;

      border: 1px solid #FDE68A;
      border-radius: 9px;

      background: var(--yellow-light);
    }

    .reward-summary span {
      color: #7A5A00;
      font-size: 10px;
      font-weight: 600;
    }

    .reward-summary strong {
      color: #B54708;
      font-size: 20px;
      font-weight: 800;
    }

    /* =========================================
       ALERT
    ========================================= */

    .alert {
      margin-top: 12px;
      padding: 10px 12px;

      border-radius: 8px;

      font-size: 10px;
      line-height: 1.45;
    }

    .alert.error {
      border: 1px solid #FDA29B;
      background: #FEF3F2;
      color: #B42318;
    }

    /* =========================================
       SUBMIT
    ========================================= */

    .submit {
      width: 100%;
      height: 48px;

      margin-top: 12px;

      border: 0;
      border-radius: 8px;

      background: var(--blue);
      color: white;

      font-size: 12px;
      font-weight: 800;

      transition: .15s ease;
    }

    .submit:hover:not(:disabled) {
      background: var(--blue-dark);
    }

    .submit:disabled {
      background: #EAECF0;
      color: #98A2B3;
      cursor: not-allowed;
    }

    .fine-print {
      margin: 9px 0 0;

      color: var(--subtle);
      font-size: 9px;
      line-height: 1.5;
      text-align: center;
    }

    /* =========================================
       STATUS
    ========================================= */

    .status-card {
      margin-top: 16px;
      padding: 22px 24px;

      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);

      box-shadow: var(--shadow);
    }

    .status-card h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .status-card > p {
      margin: 4px 0 16px;

      color: var(--muted);
      font-size: 10.5px;
    }

    .status-form {
      display: grid;
      grid-template-columns: 1fr 1fr 110px;
      gap: 8px;
    }

    .status-form button {
      height: 44px;

      border: 0;
      border-radius: 8px;

      background: var(--text);
      color: white;

      font-size: 11px;
      font-weight: 700;
    }

    .status-form button:hover {
      background: #344054;
    }

    .status-form button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status-result {
      margin-top: 12px;
    }

    .status-result-card {
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 9px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;

      padding: 11px 12px;

      border-bottom: 1px solid #F2F4F7;

      font-size: 10px;
    }

    .status-row:last-child {
      border-bottom: 0;
    }

    .status-row span:first-child {
      color: var(--muted);
    }

    .status-row strong {
      text-align: right;
    }

    .status-pill {
      display: inline-flex;
      padding: 4px 8px;

      border-radius: 5px;

      background: var(--blue-light);
      color: var(--blue-dark);

      font-size: 9px;
      font-weight: 700;
    }

    /* =========================================
       BOTTOM INFO
    ========================================= */

    .info-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 16px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: white;
      box-shadow: var(--shadow);
    }

    .info-item {
      padding: 16px;

      text-align: center;
      border-right: 1px solid var(--border);
    }

    .info-item:last-child {
      border-right: 0;
    }

    .info-item strong {
      display: block;
      margin-bottom: 3px;

      font-size: 11px;
      font-weight: 700;
    }

    .info-item span {
      color: var(--muted);
      font-size: 9px;
    }

    /* =========================================
       FOOTER
    ========================================= */

    footer {
      padding-top: 22px;
      text-align: center;
    }

    .footer-brand {
      color: var(--text-2);
      font-size: 10px;
      font-weight: 700;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 13px;

      margin-top: 8px;
    }

    .footer-links a,
    .admin-button {
      border: 0;
      padding: 0;

      background: transparent;
      color: var(--subtle);

      font-size: 9px;
      text-decoration: none;
    }

    .footer-links a:hover,
    .admin-button:hover {
      color: var(--blue);
    }

    .admin-area {
      margin-top: 12px;
    }

    /* =========================================
       SUCCESS
    ========================================= */

    .success {
      max-width: 600px;
      margin: 0 auto;
    }

    .success-card {
      padding: 34px;

      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);

      box-shadow: var(--shadow);
    }

    .success-icon {
      width: 48px;
      height: 48px;

      display: grid;
      place-items: center;

      margin-bottom: 18px;

      border: 1px solid #ABEFC6;
      border-radius: 50%;

      background: var(--green-light);
      color: var(--green);
    }

    .success-card h1 {
      margin: 0 0 7px;

      font-size: 25px;
      letter-spacing: -.04em;
    }

    .success-card > p {
      margin: 0 0 20px;

      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }

    .reference {
      padding: 15px;

      border: 1px solid #D6E2FF;
      border-radius: 9px;

      background: var(--blue-light);
    }

    .reference small {
      display: block;
      color: var(--muted);
      font-size: 9px;
    }

    .reference strong {
      display: block;
      margin: 3px 0;

      color: var(--blue-dark);
      font-size: 18px;
      letter-spacing: -.02em;
    }

    .details-list {
      overflow: hidden;

      margin-top: 13px;

      border: 1px solid var(--border);
      border-radius: 9px;
    }

    .details-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;

      padding: 11px 12px;

      border-bottom: 1px solid #F2F4F7;

      font-size: 10px;
    }

    .details-row:last-child {
      border-bottom: 0;
    }

    .details-row span {
      color: var(--muted);
    }

    .details-row strong {
      text-align: right;
    }

    .success-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;

      margin-top: 14px;
    }

    .secondary {
      height: 44px;

      border: 1px solid var(--border-dark);
      border-radius: 8px;

      background: white;
      color: var(--text-2);

      font-size: 11px;
      font-weight: 700;
    }

    .secondary:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    /* =========================================
       TABLET
    ========================================= */

    @media (max-width: 760px) {
      .page {
        width: min(680px, calc(100% - 24px));
        padding-top: 18px;
      }

      .hero {
        grid-template-columns: 1fr 240px;
        min-height: 280px;
        padding: 32px 28px;
      }

      .receipt {
        width: 190px;
        height: 130px;
      }

      .receipt-amount {
        font-size: 40px;
      }

      .status-form {
        grid-template-columns: 1fr 1fr;
      }

      .status-form button {
        grid-column: 1 / -1;
      }
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 560px) {
      .page {
        width: calc(100% - 18px);
        padding: 12px 0 32px;
      }

      .header {
        margin-bottom: 14px;
      }

      .brand-logo {
        width: 34px;
        height: 34px;
      }

      .brand-name {
        font-size: 15px;
      }

      .reward-tag {
        padding: 7px 9px;
        font-size: 9px;
      }

      .hero {
        display: block;
        min-height: 360px;
        padding: 25px 20px;
      }

      .hero h1 {
        max-width: 320px;
        font-size: 36px;
      }

      .hero-description {
        font-size: 12px;
      }

      .hero-meta {
        gap: 6px;
        margin-top: 18px;
      }

      .meta-item {
        font-size: 9px;
      }

      .reward-visual {
        height: 135px;
        margin-top: 3px;
      }

      .receipt {
        width: 185px;
        height: 115px;
      }

      .receipt-amount {
        font-size: 38px;
      }

      .card-header {
        padding: 18px 16px;
      }

      .card-title {
        font-size: 16px;
      }

      .steps {
        padding: 0 16px;
      }

      .step {
        grid-template-columns: 32px 1fr;
        gap: 10px;
        padding: 19px 0;
      }

      .step-number {
        width: 30px;
        height: 30px;
        border-radius: 8px;
      }

      .step-top {
        display: block;
      }

      .step-title {
        font-size: 13px;
      }

      .step-description {
        font-size: 10.5px;
      }

      .upload-box {
        margin-top: 11px;
      }

      .details {
        margin: 0 16px;
        padding-top: 21px;
      }

      .status-card {
        padding: 19px 16px;
      }

      .status-form {

    @media (prefers-reduced-motion: reduce) {

  </style>
</head>

<body>

<div id="app"></div>

<script>

  /* =========================================

  const LINKS = {

      link: "Open Instagram",

    {

  const state = {
    shots: {

      youtube: null,
      founder: null
    },

    instagramUsername: "",
    mobile: "",

    submitting: false,
    refId: null
  };


  const $ = selector => document.querySelector(selector);


  /* =========================================
     HELPERS
  ========================================= */

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char]));
  }


  function checkIcon() {
    return `
      <svg width="13" height="13"
           viewBox="0 0 16 16"
           fill="none"
           aria-hidden="true">
        <path
          d="M3 8.2L6.1 11.2L13 4.8"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    `;
  }


  function successIcon() {
    return `
      <svg width="21" height="21"
           viewBox="0 0 24 24"
           fill="none">
        <path
          d="M5 12.5L9.2 16.5L19 7"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    `;
  }


  function uploadIcon() {
    return `
      <svg width="17" height="17"
           viewBox="0 0 24 24"
           fill="none">
        <rect
          x="3"
          y="4"
          width="18"
          height="16"
          rx="2"
          stroke="currentColor"
          stroke-width="1.6"
        />
        <circle
          cx="8"
          cy="9"
          r="1.4"
          fill="currentColor"
        />
        <path
          d="M4.5 17L9 12.5L12.5 16L15 13.5L19.5 18"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    `;
  }


  function countDone() {
    return Object.values(state.shots).filter(Boolean).length;
  }


  /* =========================================
     IMAGE PROCESSING
  ========================================= */

  function resizeImage(file, maxWidth = 900, quality = .72) {

    return new Promise((resolve, reject) => {

      if (!file.type.startsWith("image/")) {
        return reject(
          new Error("Please select an image.")
        );
      }

      if (file.size > 8 * 1024 * 1024) {
        return reject(
          new Error("Image must be smaller than 8 MB.")
        );
      }

      const reader = new FileReader();

      reader.onload = event => {

        const img = new Image();

        img.onload = () => {

          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round(
              height * (maxWidth / width)
            );

            width = maxWidth;
          }

          const canvas = document.createElement("canvas");

          canvas.width = width;
          canvas.height = height;

          const context = canvas.getContext("2d");

          context.drawImage(
            img,
            0,
            0,
            width,
            height
          );

          canvas.toBlob(blob => {

            if (!blob) {
              return reject(
                new Error("Could not process image.")
              );
            }

            resolve(
              new File(
                [blob],
                "proof.jpg",
                { type: "image/jpeg" }
              )
            );

          }, "image/jpeg", quality);
        };

        img.onerror = () => {
          reject(
            new Error("Could not read image.")
          );
        };

        img.src = event.target.result;
      };

      reader.onerror = () => {
        reject(
          new Error("Could not read image.")
        );
      };

      reader.readAsDataURL(file);
    });
  }


  /* =========================================
     MAIN RENDER
  ========================================= */

  function render() {

    const app = $("#app");

    const completed = countDone();
    const percentage = (completed / 3) * 100;

    app.innerHTML = `

      <main class="page">

        <!-- HEADER -->

        <header class="header">

          <div class="brand">
            <div class="brand-logo">
              BW
            </div>

            <div class="brand-name">
              Bill Wallah
            </div>
          </div>

          <div class="reward-tag">
            <span>₹</span>
            ₹15 Reward
          </div>

        </header>


        <!-- HERO -->

        <section class="hero">

          <div class="hero-content">

            <div class="eyebrow">
              FOLLOW & EARN
            </div>

            <h1>
              Get <strong>₹15</strong><br>

            </h1>

            <p class="hero-description">
              Follow our social pages, upload genuine screenshots,
              and submit your details. Our team will manually review
              your request.
            </p>

            <div class="hero-meta">

              <div class="meta-item">
                <div class="meta-icon">✓</div>
                100% Free
              </div>

              <div class="meta-item">
                <div class="meta-icon">✓</div>
                Manual Review
              </div>

              <div class="meta-item">
                <div class="meta-icon">48</div>
                Within 48 Hours
              </div>

            </div>

          </div>


          <div class="reward-visual">

            <div class="visual-dot one"></div>
            <div class="visual-dot two"></div>
            <div class="visual-line"></div>

            <div class="receipt">

              <div class="receipt-inner">

                <div class="receipt-label">
                  Your Reward
                </div>

                <div class="receipt-amount">
                  ₹15
                </div>

                <div class="receipt-free">
                  FREE
                </div>

              </div>

            </div>

          </div>

        </section>


        <!-- MAIN FORM -->

        <section class="main-card">

          <div class="card-header">

            <div>
              <h2 class="card-title">
                Complete the steps
              </h2>

              <p class="card-subtitle">
                Upload proof for each completed step.
              </p>
            </div>

            <div class="progress-count">
              ${completed} / 3
            </div>

          </div>


          <div class="progress-bar">
            <div
              class="progress-fill"
              style="width:${percentage}%">
            </div>
          </div>


          <div class="steps">

            ${STEPS.map((step, index) => {

              const uploaded = !!state.shots[step.key];

              return `

                <div class="step ${uploaded ? "done" : ""}">

                  <div class="step-number">

                    ${
                      uploaded
                        ? checkIcon()
                        : index + 1
                    }

                  </div>


                  <div>

                    <div class="step-top">

                      <div>

                        <h3 class="step-title">
                          ${step.title}
                        </h3>

                        <p class="step-description">
                          ${step.desc}
                        </p>

                        <a
                          class="step-link"
                          href="${step.url}"
                          target="_blank"
                          rel="noopener">
                          ${step.link} →
                        </a>

                      </div>

                    </div>


                    <div
                      class="upload-box ${uploaded ? "filled" : ""}">

                      ${
                        uploaded

                        ? `
                          <img
                            class="upload-preview"
                            src="${URL.createObjectURL(state.shots[step.key])}"
                            alt="Uploaded screenshot">
                        `

                        : `
                          <div class="upload-placeholder">
                            ${uploadIcon()}
                          </div>
                        `
                      }


                      <div class="upload-info">

                        <strong>
                          ${
                            uploaded
                              ? "Screenshot added"
                              : "Upload screenshot"
                          }
                        </strong>

                        <span>
                          ${
                            uploaded
                              ? "Proof ready for submission"
                              : "PNG, JPG or WEBP"
                          }
                        </span>

                      </div>


                      <label class="upload-button">

                        ${
                          uploaded
                            ? "Replace"
                            : "Upload"
                        }

                        <input
                          type="file"
                          accept="image/png,image/jpeg,image/webp"
                          data-step="${step.key}">

                      </label>

                    </div>

                  </div>

                </div>

              `;

            }).join("")}

          </div>


          <!-- DETAILS -->

          <section class="details">

            <div class="details-heading">

              <h3>
                Your details
              </h3>

              <p>
                Enter your information to receive the reward.
              </p>

            </div>


            <div class="field">

              <label for="instagram-username">
                Instagram username
              </label>

              <input
                id="instagram-username"
                class="input"
                type="text"
                maxlength="50"
                placeholder="@yourusername"
                value="${esc(state.instagramUsername)}">

              <div class="hint">
                Enter the username of the account you used.
              </div>

            </div>


            <div class="field">

              <label for="mobile">
                Mobile number
              </label>

              <input
                id="mobile"
                class="input"
                type="tel"
                inputmode="numeric"
                maxlength="10"
                placeholder="10-digit mobile number"
                value="${esc(state.mobile)}"
                ${completed === 3 ? "" : "disabled"}>

              <div class="hint">

                ${
                  completed === 3
                    ? "We'll use this number for verification and payout."
                    : "Complete all 3 steps to unlock this field."
                }

              </div>

            </div>


            <label class="confirm">

              <input
                id="confirm"
                type="checkbox"
                ${completed === 3 ? "" : "disabled"}>

              <span>
                I confirm that I completed all 3 steps and
                that the screenshots I submitted are genuine.
              </span>

            </label>


            <div class="reward-summary">

              <span>
                Reward if approved
              </span>

              <strong>
                ₹15
              </strong>

            </div>


            <div
              id="form-alert"
              class="alert error hidden">
            </div>


            <button
              class="submit"
              id="submit-btn"
              ${completed === 3 ? "" : "disabled"}>

              ${
                state.submitting
                  ? "Submitting..."
                  : "Submit for verification"
              }

            </button>


            <p class="fine-print">
              One submission per mobile number.
              Screenshots are manually verified.
              Approval does not mean payment has already been sent.
            </p>

          </section>

        </section>


        <!-- STATUS -->

        <section class="status-card">

          <h2>
            Check your submission
          </h2>

          <p>
            Enter your Submission ID and mobile number
            to see the latest status.
          </p>


          <div class="status-form">

            <input
              id="status-id"
              class="input"
              placeholder="Submission ID">

            <input
              id="status-mobile"
              class="input"
              inputmode="numeric"
              maxlength="10"
              placeholder="Mobile number">

            <button id="status-btn">
              Check status
            </button>

          </div>


          <div
            id="status-result"
            class="status-result">
          </div>

        </section>


        <!-- INFO -->

        <section class="info-strip">

          <div class="info-item">

            <strong>
              48 Hour Review
            </strong>

            <span>
              Manual verification
            </span>

          </div>


          <div class="info-item">

            <strong>
              Genuine Users
            </strong>

            <span>
              Real screenshots only
            </span>

          </div>


          <div class="info-item">

            <strong>
              ₹15 Reward
            </strong>

            <span>
              If your request is approved
            </span>

          </div>

        </section>


        <!-- FOOTER -->

        <footer>

          <div class="footer-brand">
            Bill Wallah
          </div>

          <div class="footer-links">

            <a
              href="${LINKS.instagram}"
              target="_blank"
              rel="noopener">
              Instagram
            </a>

            <a
              href="${LINKS.youtube}"
              target="_blank"
              rel="noopener">
              YouTube
            </a>

            <a
              href="${LINKS.founder}"
              target="_blank"
              rel="noopener">
              Founder
            </a>

            <a href="#">
              Terms
            </a>

            <a href="#">
              Privacy
            </a>

          </div>


          <div class="admin-area">

            <button
              class="admin-button"
              id="admin-link">
              Admin login
            </button>

          </div>

        </footer>

      </main>
    `;


    bind();
  }


  /* =========================================
     EVENTS
  ========================================= */

  function bind() {

    document
      .querySelectorAll('input[type="file"]')
      .forEach(input => {

        input.addEventListener("change", async event => {

          const file = event.target.files?.[0];

          if (!file) return;

          try {

            state.shots[
              event.target.dataset.step
            ] = await resizeImage(file);

            render();

          } catch (error) {

            showAlert(error.message);

          }

        });

      });


    const username =
      $("#instagram-username");

    const mobile =
      $("#mobile");


    if (username) {

      username.addEventListener("input", event => {

        state.instagramUsername =
          event.target.value
            .trim()
            .slice(0, 50);

        event.target.value =
          state.instagramUsername;

      });

    }


    if (mobile) {

      mobile.addEventListener("input", event => {

        state.mobile =
          event.target.value
            .replace(/\D/g, "")
            .slice(0, 10);

        event.target.value =
          state.mobile;

      });

    }


    $("#submit-btn")
      ?.addEventListener(
        "click",
        handleSubmit
      );


    $("#status-btn")
      ?.addEventListener(
        "click",
        checkStatus
      );


    $("#admin-link")
      ?.addEventListener(
        "click",
        () => {
          location.href = "/admin";
        }
      );
  }


  /* =========================================
     ALERT
  ========================================= */

  function showAlert(message) {

    const box =
      $("#form-alert");

    if (!box) return;

    box.textContent =
      message;

    box.classList.remove(
      "hidden"
    );

    box.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });
  }


  /* =========================================
     SUBMIT
  ========================================= */

  async function handleSubmit() {

    if (state.submitting)
      return;


    if (countDone() !== 3) {

      return showAlert(
        "Please upload all three screenshots."
      );

    }


    if (!state.instagramUsername) {

      return showAlert(
        "Enter your Instagram username."
      );

    }


    if (!/^[6-9]\d{9}$/.test(state.mobile)) {

      return showAlert(
        "Enter a valid 10-digit Indian mobile number."
      );

    }


    if (!$("#confirm")?.checked) {

      return showAlert(
        "Please confirm that you completed all 3 steps."
      );

    }


    state.submitting = true;

    render();


    try {

      const formData =
        new FormData();

      formData.append(
        "mobileNumber",
        state.mobile
      );

      formData.append(
        "instagramUsername",
        state.instagramUsername
      );

      formData.append(
        "confirm",
        "on"
      );

      formData.append(
        "instagramScreenshot",
        state.shots.insta,
        "instagram-proof.jpg"
      );

      formData.append(
        "youtubeScreenshot",
        state.shots.youtube,
        "youtube-proof.jpg"
      );

      formData.append(
        "founderInstagramScreenshot",
        state.shots.founder,
        "founder-proof.jpg"
      );


      const response =
        await fetch(
          "/api/submissions",
          {
            method: "POST",
            body: formData
          }
        );


      const data =
        await response
          .json()
          .catch(() => ({}));


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Could not submit right now."
        );

      }


      state.refId =
        data.submissionId;

      renderSuccess();


    } catch (error) {

      state.submitting = false;

      render();

      showAlert(
        error.message
      );
    }
  }


  /* =========================================
     SUCCESS
  ========================================= */

  function renderSuccess() {

    const app =
      $("#app");


    app.innerHTML = `

      <main class="page success">

        <header class="header">

          <div class="brand">

            <div class="brand-logo">
              BW
            </div>

            <div class="brand-name">
              Bill Wallah
            </div>

          </div>

          <div class="reward-tag">
            <span>₹</span>
            ₹15 Reward
          </div>

        </header>


        <section class="success-card">

          <div class="success-icon">
            ${successIcon()}
          </div>


          <h1>
            Submission received
          </h1>


          <p>
            Your screenshots have been submitted for manual
            verification. We'll review your entry within
            48 hours. If approved, the team will manually
            send ₹15 to your submitted mobile number.
          </p>


          <div class="reference">

            <small>
              Submission ID
            </small>

            <strong>
              ${esc(state.refId)}
            </strong>

            <small>
              Keep this ID to check your status later.
            </small>

          </div>


          <div class="details-list">

            <div class="details-row">

              <span>
                Mobile number
              </span>

              <strong>
                ${esc(state.mobile)}
              </strong>

            </div>


            <div class="details-row">

              <span>
                Status
              </span>

              <strong>
                Pending review
              </strong>

            </div>


            <div class="details-row">

              <span>
                Reward
              </span>

              <strong>
                ₹15 if approved
              </strong>

            </div>

          </div>


          <div class="success-actions">

            <button
              class="secondary"
              id="check-now">
              Check status
            </button>

            <button
              class="secondary"
              id="new-entry">
              Done
            </button>

          </div>

        </section>

      </main>
    `;


    $("#check-now").onclick = () => {

      render();

      $("#status-id").value =
        state.refId || "";

      $("#status-mobile").value =
        state.mobile;

      $("#status-btn").click();

      document
        .querySelector(".status-card")
        ?.scrollIntoView({
          behavior: "smooth"
        });
    };


    $("#new-entry").onclick = () => {

      state.shots = {
        insta: null,
        youtube: null,
        founder: null
      };

      state.instagramUsername = "";
      state.mobile = "";
      state.submitting = false;
      state.refId = null;

      render();
    };
  }


  /* =========================================
     CHECK STATUS
  ========================================= */

  async function checkStatus() {

    const id =
      $("#status-id")
        ?.value
        .trim();

    const mobile =
      $("#status-mobile")
        ?.value
        .trim();


    if (
      !id ||
      !/^[6-9]\d{9}$/.test(mobile)
    ) {

      return $("#status-result").innerHTML = `
        <div class="alert error">
          Enter a valid Submission ID and
          10-digit Indian mobile number.
        </div>
      `;
    }


    const button =
      $("#status-btn");

    button.disabled = true;
    button.textContent =
      "Checking...";


    try {

      const response =
        await fetch(
          `/api/status?submissionId=${encodeURIComponent(id)}&mobileNumber=${encodeURIComponent(mobile)}`
        );


      const data =
        await response
          .json()
          .catch(() => ({}));


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Could not check status."
        );

      }


      const displayStatus =
        data.status === "Pending"
          ? "Under Review"
          : data.status === "Approved"
            ? "Approved — payout pending"
            : data.status === "Rejected"
              ? "Rejected"
              : data.status;


      $("#status-result").innerHTML = `

        <div class="status-result-card">

          <div class="status-row">

            <span>
              Submission ID
            </span>

            <strong>
              ${esc(data.submissionId)}
            </strong>

          </div>


          <div class="status-row">

            <span>
              Status
            </span>

            <span class="status-pill">
              ${esc(displayStatus)}
            </span>

          </div>


          <div class="status-row">

            <span>
              Submitted
            </span>

            <strong>
              ${new Date(
                data.submittedAt
              ).toLocaleString()}
            </strong>

          </div>


          <div class="status-row">

            <span>
              Payout
            </span>

            <strong>
              ${
                data.paymentStatus === "Paid"
                  ? "Paid ₹15"
                  : "Pending"
              }
            </strong>

          </div>


          ${
            data.rejectionReason

              ? `
                <div class="status-row">

                  <span>
                    Reason
                  </span>

                  <strong>
                    ${esc(
                      data.rejectionReason
                    )}
                  </strong>

                </div>
              `

              : ""
          }

        </div>
      `;


    } catch (error) {

      $("#status-result").innerHTML = `
        <div class="alert error">
          ${esc(error.message)}
        </div>
      `;


    } finally {

      button.disabled = false;
      button.textContent =
        "Check status";
    }
  }


  /* =========================================
     START
  ========================================= */

  render();

</script>

</body>
</html>
