<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill Wallah Admin</title><link rel="stylesheet" href="/admin.css"></head><body><div id="login" class="login"><div class="login-card"><div class="brand">Bill Wallah</div><h1>Admin Panel</h1><p>Review submissions and record manual payouts.</p><form id="loginForm"><input name="email" type="email" placeholder="Admin email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button><div id="loginError"></div></form></div></div><div id="app" class="hidden"><header><div class="wrap"><div class="brand">Bill Wallah <span>Admin</span></div><div><span id="adminEmail" class="admin-email"></span><button id="logout">Log out</button></div></div></header><main class="wrap"><div class="head"><div><p class="eyebrow">Operations</p><h1>Payout Requests</h1><p>Manually review proof. Only mark Paid after the team has actually sent ₹15.</p></div><button class="refresh" onclick="load()">Refresh</button></div><div id="cards" class="cards"></div><div class="panel"><div class="toolbar"><input id="search" placeholder="Search Submission ID or mobile"><select id="filter"><option value="all">All statuses</option><option>Pending</option><option>Approved</option><option>Rejected</option><option value="Paid">Paid</option></select></div><div class="table-wrap"><table><thead><tr><th>Submission</th><th>User</th><th>Status</th><th>Payout</th><th>Submitted</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div><div id="modal" class="modal hidden"><div class="modal-card"><button class="close" onclick="closeModal()">×</button><div id="detail"></div></div></div><script src="/admin.js"></script></body></html>
